  const helpers=String.raw`
const acAlertState={ui:false,audioCtx:null,lastSideTone:0,lastFrontTone:0,lastVisual:{left:0,right:0,front:0},tracks:Object.create(null)};

function acShowArrow(side,red,intensity=1){acAlertInit();const el=document.getElementById('acSideArrow-'+side);if(!el)return;const n=performance.now(),wait=red?300:450;if(n-acAlertState.lastVisual[side]<wait)return;acAlertState.lastVisual[side]=n;const col=red?'#ff253f':'#ffd43b';el.style.color=col;el.style.textShadow='0 0 8px '+col+',0 0 20px '+col+',0 0 42px '+col;const peak=Math.max(.80,Math.min(1,red?.99:.86)*Math.max(.88,Math.min(1.08,intensity)));if(el.getAnimations)el.getAnimations().forEach(a=>a.cancel());if(el.animate)el.animate([{opacity:0,transform:'translateY(-50%) scale(.72)'},{opacity:peak,transform:'translateY(-50%) scale(1.12)'},{opacity:0,transform:'translateY(-50%) scale(.94)'}],{duration:red?500:680,iterations:red?2:1,easing:'ease-out'});else{el.style.opacity=String(peak);setTimeout(()=>el.style.opacity='0',red?620:740)}}
function acShowFront(r,red){acAlertInit();const el=document.getElementById('acCenterDot');if(!el||acSamePace(r))return;const n=performance.now(),wait=red?250:390;if(n-acAlertState.lastVisual.front<wait)return;acAlertState.lastVisual.front=n;const closing=Number.isFinite(r&&r.closing)?r.closing:0,score=Number.isFinite(r&&r.score)?r.score:0,sev=Math.max(0,Math.min(1,(red?.78:.34)+Math.min(.22,Math.max(0,score-55)/220)+Math.min(.16,Math.max(0,closing)*7))),size=Math.round(38+sev*80),core=red?'rgba(255,28,50,.96)':'rgba(255,210,42,.92)',mid=red?'rgba(255,28,50,.42)':'rgba(255,210,42,.34)';el.style.width=size+'px';el.style.height=size+'px';el.style.background='radial-gradient(circle,'+core+' 0%,'+core+' 12%,'+mid+' 36%,rgba(0,0,0,0) 72%)';el.style.filter='blur('+(red?'.5':'1.1')+'px) drop-shadow(0 0 '+Math.round(16+sev*28)+'px '+core+')';if(el.getAnimations)el.getAnimations().forEach(a=>a.cancel());if(el.animate)el.animate([{opacity:0,transform:'translate(-50%,-50%) scale(.55)'},{opacity:Math.min(1,.58+sev*.40),transform:'translate(-50%,-50%) scale(1.05)'},{opacity:0,transform:'translate(-50%,-50%) scale(.82)'}],{duration:red?500:700,iterations:red?2:1,easing:'ease-out'});else{el.style.opacity=String(.65+sev*.3);setTimeout(()=>el.style.opacity='0',red?620:780)}}
