<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>AntiColisión 360 — V5.9</title><style>html,body{margin:0;height:100%;background:#05080d;color:#fff;font-family:system-ui}#load{height:100%;display:grid;place-items:center;text-align:center;padding:28px}.card{max-width:560px;background:#081018;border:1px solid #ffffff22;border-radius:24px;padding:24px}b{font-size:24px}</style></head><body><div id="load"><div class="card"><b>AntiColisión 360 — V5.9</b><p>Preparando Calzada Inteligente…</p></div></div><script>
(async()=>{

 src=src.replace('Mantiene la base V5.7 y agrega aprendizaje del conductor, vigilancia ampliada en giros y alarma roja basada en aproximación real estimada.','Mantiene la base adaptativa V5.8, elimina el velo blanco y agrega análisis visual de bordes, carriles y tipo de vía.');

 const smart=`const roadCv=document.createElement('canvas'),roadCtx=roadCv.getContext('2d',{willReadFrequently:true});roadCv.width=320;roadCv.height=180;

function roadRGB(data,w,x,y){const i=(Math.round(y)*w+Math.round(x))*4;return[data[i]||0,data[i+1]||0,data[i+2]||0]}
function roadGray(data,w,x,y){const q=roadRGB(data,w,x,y);return .299*q[0]+.587*q[1]+.114*q[2]}
function roadMap(nx,ny){const vw=video.videoWidth||480,vh=video.videoHeight||640,sw=innerWidth,sh=innerHeight,sc=Math.max(sw/vw,sh/vh),ox=(sw-vw*sc)/2,oy=(sh-vh*sc)/2;return{x:ox+nx*vw*sc,y:oy+ny*vh*sc}}
function analyzeRoad(){if(video.readyState<2||Date.now()-roadModel.last<230)return;roadModel.last=Date.now();const w=roadCv.width,h=roadCv.height;try{roadCtx.drawImage(video,0,0,w,h)}catch(_e){return}const data=roadCtx.getImageData(0,0,w,h).data,ys=[.54,.64,.74,.86].map(v=>Math.round(v*h)),dir=currentTurn(),bias=dir==='right'?.06:dir==='left'?-.06:0,rows=[];
for(let ri=0;ri<ys.length;ri++){const y=ys[ri],p=ri/(ys.length-1),c=.5+bias*(1-p*.35),half=.20+.27*p,lt=(c-half)*w,rt=(c+half)*w;let lb={x:Math.max(4,lt),s:-1},rb={x:Math.min(w-5,rt),s:-1};for(let x=4;x<w-4;x++){const g=Math.abs(roadGray(data,w,x+3,y)-roadGray(data,w,x-3,y));if(x<c*w-10){const s=g-Math.abs(x-lt)*.12;if(s>lb.s)lb={x,s,g}}else if(x>c*w+10){const s=g-Math.abs(x-rt)*.12;if(s>rb.s)rb={x,s,g}}}if(rb.x-lb.x<w*.24){lb={x:Math.round((c-half)*w),g:0};rb={x:Math.round((c+half)*w),g:0}}const marks=[];for(let x=Math.round(lb.x+8);x<rb.x-8;x+=2){const q=roadRGB(data,w,x,y),lum=.299*q[0]+.587*q[1]+.114*q[2],local=(roadGray(data,w,x-7,y)+roadGray(data,w,x+7,y))/2,white=lum>150&&lum-local>44,yellow=q[0]>145&&q[1]>105&&q[2]<125&&q[0]>q[2]*1.25;if(white||yellow){const kind=yellow?'yellow':'white';if(!marks.length||x-marks[marks.length-1].x>10)marks.push({x,kind});else if(kind==='yellow')marks[marks.length-1]={x,kind}}}rows.push({y,left:lb.x,right:rb.x,marks,edge:((lb.g||0)+(rb.g||0))/2})}
const bot=rows[3],up=rows[1],left=clamp(bot.left/w,.01,.48),right=clamp(bot.right/w,.52,.99),bottomC=(left+right)/2,upC=(up.left+up.right)/(2*w);let marks=bot.marks.map(m=>({x:m.x/w,kind:m.kind})).filter(m=>m.x>left+.04&&m.x<right-.04);marks=marks.filter((m,i,a)=>i===0||m.x-a[i-1].x>.055).slice(0,4);const center=marks.find(m=>m.kind==='yellow')||null,lanes=clamp(marks.length+1,1,5),edgeConf=clamp((rows.reduce((s,r)=>s+r.edge,0)/4-10)/55,0,1),widthConf=clamp(((right-left)-.34)/.52,0,1),conf=clamp(edgeConf*.52+(marks.length?.28:.07)+widthConf*.20,0,1);let type='CALZADA';if(center)type='DOBLE MANO?';else if(lanes>=3)type='MULTI '+lanes;else if(lanes===2)type='2 CARRILES?';else if(widthConf>.68)type='VÍA ANCHA';const gpsCurve=dir==='right'?.07:dir==='left'?-.07:0,curve=clamp((upC-bottomC)*1.7,-.18,.18)*.65+gpsCurve*.35,a=roadModel.confidence>.05?.72:0;roadModel={left:roadModel.left*a+left*(1-a),right:roadModel.right*a+right*(1-a),vanish:roadModel.vanish*a+upC*(1-a),curve:roadModel.curve*a+curve*(1-a),confidence:roadModel.confidence*.55+conf*.45,marks,lanes,type,center,last:Date.now()};const c=Math.round(roadModel.confidence*100),te=document.getElementById('roadType'),le=document.getElementById('laneCount'),ce=document.getElementById('roadConf');if(te)te.textContent=roadModel.type;if(le)le.textContent=roadModel.lanes;if(ce)ce.textContent=c+'%'}
function roadLine(bx,tx,color,width,dash){const p0=roadMap(bx,.88),mid=.5*(bx+tx),p1=roadMap(mid+roadModel.curve*.35,.70),p2=roadMap(tx+roadModel.curve,.54);ctx.save();ctx.strokeStyle=color;ctx.lineWidth=width;ctx.lineCap='round';if(dash)ctx.setLineDash([13,10]);ctx.beginPath();ctx.moveTo(p0.x,p0.y);ctx.quadraticCurveTo(p1.x,p1.y,p2.x,p2.y);ctx.stroke();ctx.restore()}
function roadGuide(){const kmh=Number.isFinite(gps.speed)?gps.speed*3.6:0;if(kmh<5)return;analyzeRoad();if(roadModel.confidence<.18){const sw=innerWidth,sh=innerHeight,dir=currentTurn(),shift=dir==='right'?.11:dir==='left'?-.11:0;ctx.save();ctx.strokeStyle='rgba(255,255,255,.92)';ctx.lineWidth=4;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(sw*.08,sh*.84);ctx.quadraticCurveTo(sw*(.22+shift*.35),sh*.68,sw*(.34+shift),sh*.57);ctx.stroke();ctx.beginPath();ctx.moveTo(sw*.92,sh*.84);ctx.quadraticCurveTo(sw*(.78+shift*.35),sh*.68,sw*(.66+shift),sh*.57);ctx.stroke();ctx.restore();return}const L=roadModel.left,R=roadModel.right,V=roadModel.vanish;roadLine(L,V-.04,'rgba(255,255,255,.96)',4.2,false);roadLine(R,V+.04,'rgba(255,255,255,.96)',4.2,false);for(const m of roadModel.marks){const cen=roadModel.center&&Math.abs(m.x-roadModel.center.x)<.02;roadLine(m.x,V,cen?'rgba(255,205,70,.96)':'rgba(255,255,255,.88)',cen?3.4:2.7,!cen)}}`;
 src=src.replace(/function roadGuide\(\)\{[\s\S]*?\}\nfunction resetDigitalZoom\(\)\{/,smart+'\nfunction resetDigitalZoom(){');
