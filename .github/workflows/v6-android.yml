name: Build AntiColision 360 V6 Android

on:
  push:
    branches: [v6-native]
    paths:
      - 'android-v6-safe/**'
      - '.github/workflows/v6-android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Restore stable test signing key
        run: base64 -d android-v6-safe/test-signing.keystore.b64 > android-v6-safe/test-signing.keystore

      - name: Build debug APK
        run: gradle -p android-v6-safe --stacktrace assembleDebug

      - name: Prepare APK and ZIP
        run: |
          cp android-v6-safe/app/build/outputs/apk/debug/app-debug.apk AntiColision360-V6.0-alpha4.apk
          zip -j AntiColision360-V6.0-alpha4.zip AntiColision360-V6.0-alpha4.apk
          sha256sum AntiColision360-V6.0-alpha4.apk AntiColision360-V6.0-alpha4.zip

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: AntiColision360-V6.0-alpha4
          path: |
            AntiColision360-V6.0-alpha4.apk
            AntiColision360-V6.0-alpha4.zip

      - name: Create or update prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v6.0-alpha4
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" AntiColision360-V6.0-alpha4.apk AntiColision360-V6.0-alpha4.zip --clobber
          else
            gh release create "$TAG" AntiColision360-V6.0-alpha4.apk AntiColision360-V6.0-alpha4.zip \
              --target "$GITHUB_SHA" \
              --title 'AntiColisión 360 V6.0 Alpha 4' \
              --notes 'Cámara trasera nativa + GPS + IMU. Muestra velocidad, precisión GPS, rumbo GPS, rumbo IMU, aceleración y giro. Sin IA todavía. Mantiene firma de prueba estable y ZIP para Android.' \
              --prerelease
          fi
