name: Build AntiColision 360 V6 Android

on:
  push:
    branches: [v6-native]
    paths:
      - 'android-v6/**'
      - '.github/workflows/v6-android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Expand V6 source
        run: |
          mkdir -p android-v6
          cat android-v6/source.part*.b64 | base64 -d > /tmp/ac360-v6-source.tgz
          tar -xzf /tmp/ac360-v6-source.tgz -C android-v6

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Download EfficientDet Lite0
        run: |
          mkdir -p android-v6/app/src/main/assets
          curl --fail --location --retry 3 \
            'https://storage.googleapis.com/download.tensorflow.org/models/tflite/task_library/object_detection/rpi/lite-model_efficientdet_lite0_detection_metadata_1.tflite' \
            -o android-v6/app/src/main/assets/efficientdet-lite0.tflite
          test -s android-v6/app/src/main/assets/efficientdet-lite0.tflite

      - name: Build debug APK
        run: gradle -p android-v6 --stacktrace assembleDebug

      - name: Prepare APK
        run: |
          cp android-v6/app/build/outputs/apk/debug/app-debug.apk AntiColision360-V6.0-alpha1.apk
          sha256sum AntiColision360-V6.0-alpha1.apk

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: AntiColision360-V6.0-alpha1
          path: AntiColision360-V6.0-alpha1.apk

      - name: Create or update prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v6.0-alpha1
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" AntiColision360-V6.0-alpha1.apk --clobber
          else
            gh release create "$TAG" AntiColision360-V6.0-alpha1.apk \
              --target "$GITHUB_SHA" \
              --title 'AntiColisión 360 V6.0 alpha 1' \
              --notes 'Primera APK nativa: cámara trasera, GPS/IMU, carril, EfficientDet-Lite0, prioridad VRU y posición izquierda/adelante/derecha.' \
              --prerelease
          fi
