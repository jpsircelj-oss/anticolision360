name: Build AntiColision 360 V6 Android

on:
  push:
    branches: [v6-native]
    paths:
      - 'android-v6-safe/**'
      - '.github/workflows/v6-android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Build debug APK
        run: gradle -p android-v6-safe --stacktrace assembleDebug

      - name: Prepare APK
        run: |
          cp android-v6-safe/app/build/outputs/apk/debug/app-debug.apk AntiColision360-V6.0-alpha2.apk
          sha256sum AntiColision360-V6.0-alpha2.apk

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: AntiColision360-V6.0-alpha2
          path: AntiColision360-V6.0-alpha2.apk

      - name: Create or update prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v6.0-alpha2
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" AntiColision360-V6.0-alpha2.apk --clobber
          else
            gh release create "$TAG" AntiColision360-V6.0-alpha2.apk \
              --target "$GITHUB_SHA" \
              --title 'AntiColisión 360 V6.0 alpha 2' \
              --notes 'APK mínima de diagnóstico. Debe abrir una pantalla ARRANQUE SEGURO sin cámara, GPS, audio ni IA. Sirve para validar compatibilidad nativa antes de agregar módulos.' \
              --prerelease
          fi
