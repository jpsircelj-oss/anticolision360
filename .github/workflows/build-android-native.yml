name: Build AntiColision 360 Core 2

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore exact Core 2 source
        shell: bash
        run: |
          cat core2-build/part-*.b64 > /tmp/core2.b64
          base64 -d /tmp/core2.b64 > /tmp/core2.zip
          rm -rf android-native AntiColision360-Core
          unzip -q /tmp/core2.zip -d .
          mv AntiColision360-Core android-native

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Core 2 debug APK
        working-directory: android-native
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload Core 2 APK
        uses: actions/upload-artifact@v4
        with:
          name: AntiColision360-Core-2.0-APK
          path: android-native/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
