<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>AntiColisión 360 — V5.7</title>
</head>
<body style="margin:0;background:#02050a;color:white;font-family:system-ui">
<div id="loading" style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px">Cargando AntiColisión 360 V5.7…</div>
<script>
(async()=>{
  try{
    let h=await (await fetch('./index.html?v57='+Date.now(),{cache:'no-store'})).text();

    h=h.replaceAll('V5.5','V5.7');
    h=h.replace(
      'V5.7: cámara aclarada 27 %, recuadros verde/amarillo/rojo, destello y alarma solo en rojo, líneas blancas desde 5 km/h.',
      'V5.7: cámara trasera Android confirmada, bordes blancos adaptativos por encima del capó, línea media y posible mano contraria; destello y alarma solo en rojo.'
    );
    h=h.replace(
      '✓ Bordes blancos de calzada desde 5 km/h<br>',
      '✓ Bordes blancos adaptativos por encima del capó desde 5 km/h<br>\n        ✓ Línea media de la calzada<br>\n        ✓ Referencia de posible mano contraria<br>'
    );
    h=h.replace('const ROAD_ROWS=[.88,.78,.68,.59];','const ROAD_ROWS=[.80,.72,.65,.59];');
    h=h.replace(
      "ctx.lineJoin='round';\n    ctx.setLineDash([]);\n\n    const traceSide=points=>{",
      "ctx.lineJoin='round';\n    ctx.setLineDash([]);\n    ctx.beginPath();\n    ctx.rect(0,0,sw,sh*.825);\n    ctx.clip();\n\n    const traceSide=points=>{"
    );
    h=h.replace(
      "ctx.beginPath();\n    traceSide(centerPoints);\n    ctx.stroke();\n    ctx.restore();",
      "ctx.beginPath();\n    traceSide(centerPoints);\n    ctx.stroke();\n\n    const laneRow=1;\n    const laneX=(roadEdges.left.points[laneRow].x+centerPoints[laneRow].x)*.5*sw;\n    const laneY=centerPoints[laneRow].y*sh;\n    ctx.setLineDash([]);\n    ctx.strokeStyle='rgba(255,255,255,.78)';\n    ctx.lineWidth=2.4;\n    ctx.beginPath();\n    ctx.moveTo(laneX,laneY-15); ctx.lineTo(laneX,laneY+9);\n    ctx.moveTo(laneX-6,laneY+2); ctx.lineTo(laneX,laneY+9); ctx.lineTo(laneX+6,laneY+2);\n    ctx.stroke();\n    ctx.font='700 8px system-ui';\n    ctx.textAlign='center';\n    ctx.fillStyle='rgba(255,255,255,.72)';\n    ctx.fillText('POSIBLE MANO CONTRARIA',laneX,laneY-20);\n    ctx.restore();"
    );

    // Cámara V5.7: usa exactamente la secuencia que funcionó en la prueba real
    // del teléfono: environment ideal -> environment exact -> video básico.
    const cameraPattern=/  async function startCamera\(\)\{[\s\S]*?\n  \}\n\n  function startGPS\(\)\{/;
    const cameraReplacement=`  async function startCamera(){
    stopCameraStream();
    activeCameraInfo=null;
    cameraAttemptLog=[];

    if(!window.isSecureContext){
      cameraError='La cámara requiere HTTPS';
      cameraState.textContent='CAM ✕';
      cameraState.className='pill glass danger';
      statusText.textContent='Abrí AntiColisión 360 desde GitHub Pages por HTTPS.';
      return false;
    }
    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
      cameraError='getUserMedia no disponible';
      cameraState.textContent='CAM ✕';
      cameraState.className='pill glass danger';
      statusText.textContent='Este navegador no permite acceder a la cámara.';
      return false;
    }

    const wanted=facingMode==='user'?'user':'environment';
    cameraState.textContent=wanted==='environment'?'TRASERA…':'FRONTAL…';
    cameraState.className='pill glass warn';

    function gumWithTimeout(videoConstraints,ms=7000){
      let expired=false;
      const request=navigator.mediaDevices.getUserMedia({audio:false,video:videoConstraints}).then(s=>{
        if(expired){
          try{s.getTracks().forEach(t=>t.stop());}catch(_e){}
          throw new Error('La cámara respondió fuera de tiempo');
        }
        return s;
      });
      const timeout=new Promise((_,reject)=>setTimeout(()=>{
        expired=true;
        reject(new Error('Tiempo de espera agotado al abrir la cámara'));
      },ms));
      return Promise.race([request,timeout]);
    }

    let lastErr=null;
    const tries=[
      {name:'facing ideal',c:{facingMode:{ideal:wanted}}},
      {name:'facing exact',c:{facingMode:{exact:wanted}}},
      {name:'video básico',c:true}
    ];

    for(const t of tries){
      let candidate=null;
      try{
        cameraLog('V5.7 intento: '+t.name);
        candidate=await gumWithTimeout(t.c);
        const track=candidate.getVideoTracks()[0];
        if(!track) throw new Error('No se recibió pista de video');

        stream=candidate;
        video.srcObject=stream;
        video.muted=true;
        video.autoplay=true;
        video.playsInline=true;
        video.setAttribute('playsinline','');
        video.setAttribute('webkit-playsinline','');
        await video.play();
        await new Promise(r=>setTimeout(r,500));

        const settings=track.getSettings?track.getSettings():{};
        const reported=settings.facingMode||wanted;
        facingMode=reported;
        activeCameraInfo={
          requested:wanted,
          inferred:reported,
          label:track.label||t.name,
          settings,
          verified:!!settings.facingMode
        };
        cameraError='';
        cameraState.textContent=wanted==='environment'?'TRASERA ✓':'FRONTAL ✓';
        cameraState.className='pill glass ok';
        statusText.textContent='Cámara activa. V5.7 lista.';
        try{updateCameraZoom();}catch(_e){}
        cameraLog('V5.7 cámara activa: '+(track.label||t.name));
        return true;
      }catch(err){
        lastErr=err;
        cameraLog('V5.7 falló '+t.name+': '+(err.name||'Error')+': '+(err.message||err));
        if(candidate){try{candidate.getTracks().forEach(x=>x.stop());}catch(_e){}}
        if(stream===candidate){stream=null;video.srcObject=null;}
      }
    }

    cameraError=lastErr?(lastErr.name||'Error')+': '+(lastErr.message||lastErr):'No se encontró cámara';
    cameraState.textContent='CAM ✕';
    cameraState.className='pill glass danger';
    statusText.textContent='No se pudo abrir la cámara.';
    return false;
  }

  function startGPS(){`;

    if(!cameraPattern.test(h)) throw new Error('No se encontró el bloque de cámara de base');
    h=h.replace(cameraPattern,cameraReplacement);

    // En V5.7 la cámara se abre PRIMERO. Sólo después arrancan audio, sensores,
    // GPS e IA. Así evitamos que otra inicialización compita con getUserMedia.
    const startPattern=/  async function startAll\(\)\{[\s\S]*?\n  \}\n\n  document\.getElementById\('startBtn'\)\.addEventListener\('click',startAll\);/;
    const startReplacement=`  async function startAll(){
    if(!window.isSecureContext || !navigator.mediaDevices?.getUserMedia){
      const secureUrl='https://jpsircelj-oss.github.io/anticolision360/v57.html';
      const description=startScreen.querySelector('.startBox p');
      description.textContent='La cámara trasera requiere abrir AntiColisión 360 desde GitHub Pages por HTTPS.';
      description.style.color='#ffd35a';
      const startBtn=document.getElementById('startBtn');
      startBtn.textContent='ABRIR PÁGINA SEGURA';
      startBtn.onclick=()=>{window.location.href=secureUrl;};
      return;
    }

    facingMode='environment';
    startScreen.style.display='none';
    hud.style.display='block';

    const cameraOK=await startCamera();
    if(!cameraOK) return;

    try{
      await activateAudio();
      updateSoundButton();
    }catch(_e){}
    try{
      await requestSensorPermissionIfNeeded();
      startSensors();
    }catch(err){
      sensorError=(err.name||'Error')+': '+(err.message||err);
    }
    startGPS();
    draw();
    loadAI();
  }

  document.getElementById('startBtn').addEventListener('click',startAll);`;

    if(!startPattern.test(h)) throw new Error('No se encontró el arranque principal de base');
    h=h.replace(startPattern,startReplacement);

    document.open();
    document.write(h);
    document.close();
  }catch(e){
    document.getElementById('loading').textContent='No se pudo cargar V5.7: '+e.message;
  }
})();
</script>
</body>
</html>
