<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>AntiColisión 360 — V5.7</title>
</head>
<body style="margin:0;background:#02050a;color:white;font-family:system-ui">
<div id="loading" style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px">Cargando AntiColisión 360 V5.7…</div>
<script>
(async()=>{
  try{
    // V5.7 vuelve a usar SIN MODIFICAR el motor de cámara de V5.2,
    // que fue la versión estable en este teléfono. Sólo se aplican cambios visuales.
    let h=await (await fetch('./v5.2.html?v57base='+Date.now(),{cache:'no-store'})).text();

    h=h.replaceAll('V5.2','V5.7');
    h=h.replaceAll('v5.2','v5.7');

    // Mantener imagen aclarada al 27 %.
    h=h.replace(/#cameraWhiteVeil\{([^}]*)background:rgba\(255,255,255,[^)]+\)/,
      '#cameraWhiteVeil{$1background:rgba(255,255,255,.27)');

    // Líneas desde 5 km/h y algo más arriba para no invadir el capó.
    h=h.replace('const ROAD_ROWS=[.88,.78,.68,.59];','const ROAD_ROWS=[.80,.72,.65,.59];');
    h=h.replace('const MIN_ROAD_SPEED_KMH=5;','const MIN_ROAD_SPEED_KMH=5;');

    // No tocar startCamera(), attachCandidate(), getUserMedia() ni startAll().
    // Así la cámara queda exactamente igual a V5.2.

    document.open();
    document.write(h);
    document.close();
  }catch(e){
    document.getElementById('loading').textContent='No se pudo cargar V5.7: '+e.message;
  }
})();
</script>
</body>
</html>
